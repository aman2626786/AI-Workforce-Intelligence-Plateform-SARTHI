services:
  - type: web
    name: skillvantage-ai-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOW_ALL_CORS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: API_V1_STR
        value: "/api"
